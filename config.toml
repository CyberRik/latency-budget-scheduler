# Single source of truth for every stage. Paths are relative to this file.

[paths]
models_dir = "models"
results_dir = "results"

[data]
# BDD100K 10k val images (1280x720). These also have semantic-seg labels,
# which Stage 5 needs for mIoU.
frames_glob = "data/bdd100k/images/10k/val/*.jpg"
frame_hw = [720, 1280]                 # all BDD100K frames; fused graphs are static
seg_gt_dir = "data/bdd100k/labels/sem_seg/val"

[runtime]
device_id = 0
# Fail session creation if the CUDA EP cannot be registered. ORT may still
# place individual nodes on CPU; stage 1 reports per-node placement.
require_cuda = true
cudnn_conv_algo_search = "EXHAUSTIVE"   # EXHAUSTIVE | HEURISTIC | DEFAULT
graph_optimization = "all"              # disable | basic | extended | all
# kSameAsRequested makes the BFC arena grow only by what is requested, so
# device-memory deltas reflect real need rather than power-of-two rounding.
arena_extend_strategy = "kSameAsRequested"
use_tf32 = true                         # ORT CUDA EP default; Ampere TF32 convs/matmuls

[models.detector]
name = "yolov10n"
task = "detection"
weights = "yolov10n.pt"                 # ultralytics release asset
onnx = "models/yolov10n_fp32.onnx"
input_hw = [640, 640]
score_threshold = 0.25

[models.segmenter]
name = "segformer_b0_cityscapes"
task = "segmentation"
hf_id = "nvidia/segformer-b0-finetuned-cityscapes-512-1024"
onnx = "models/segformer_b0_fp32.onnx"
# 576x1024 keeps BDD's 16:9 aspect (1.778) and is divisible by 32.
input_hw = [576, 1024]
# Stage 2b resolution sweep (all divisible by 32, aspect 1.75-1.79).
sweep_hw = [[576, 1024], [448, 800], [384, 672], [288, 512]]
sweep_onnx = "models/segformer_b0_{h}x{w}_fp32.onnx"

# ---- Stage 2b: fused variants (pre/post-processing inside the graph, on GPU).
# Input: raw uint8 BGR frame [1,720,1280,3]. Built by scripts/build_fused.py.
[models.detector_fused]
name = "yolov10n_fused"
task = "detection"
fused = true
source_onnx = "models/yolov10n_fp32.onnx"
onnx = "models/yolov10n_fused_fp32.onnx"
input_hw = [640, 640]
score_threshold = 0.25

[models.seg_fused_576x1024]
name = "segformer_b0_fused_576x1024"
task = "segmentation"
fused = true
source_onnx = "models/segformer_b0_576x1024_fp32.onnx"
onnx = "models/segformer_b0_fused_576x1024_fp32.onnx"
input_hw = [576, 1024]

[models.seg_fused_448x800]
name = "segformer_b0_fused_448x800"
task = "segmentation"
fused = true
source_onnx = "models/segformer_b0_448x800_fp32.onnx"
onnx = "models/segformer_b0_fused_448x800_fp32.onnx"
input_hw = [448, 800]

[models.seg_fused_384x672]
name = "segformer_b0_fused_384x672"
task = "segmentation"
fused = true
source_onnx = "models/segformer_b0_384x672_fp32.onnx"
onnx = "models/segformer_b0_fused_384x672_fp32.onnx"
input_hw = [384, 672]

[models.seg_fused_288x512]
name = "segformer_b0_fused_288x512"
task = "segmentation"
fused = true
source_onnx = "models/segformer_b0_288x512_fp32.onnx"
onnx = "models/segformer_b0_fused_288x512_fp32.onnx"
input_hw = [288, 512]

[export]
opset = 17

[harness]
deadline_ms = 33.0
preload_frames = 100        # decoded into RAM (1280x720x3 = 2.6 MiB each), cycled
warmup_iters = 50           # closed-loop, discarded; first iteration reported as cold start
measure_frames = 1000       # per run; p99 then rests on ~10 samples (CI reported)
disable_gc = true           # Python GC paused during the timed loop
telemetry_interval_ms = 100 # nvidia-smi sampling, separate process
cooldown_s = 15             # idle between runs so runs start from similar GPU temperature
bootstrap_resamples = 1000
seed = 0

[stage2]
models = ["detector", "segmenter"]
fps = [0, 30]               # 0 = closed loop (back-to-back, pure service time)
out_dir = "results/stage2"

[stage3]
# Both models on every frame, sequentially (detector first). One pipeline per
# degrade-ladder rung.
pipelines = [["detector_fused", "seg_fused_384x672"], ["detector_fused", "seg_fused_288x512"]]
fps = [0, 10, 15, 20, 25, 30, 35, 40, 45, 50]   # 0 = closed loop
repeats = 3
out_dir = "results/stage3"

[scheduler]
# Stage 4 deadline-aware policy (bsched/scheduler.py). Fixed before any
# Stage 4 run at the RFC 6298 (TCP retransmission timer) values; not tuned on
# the evaluation sweep.
ewma_alpha = 0.125          # weight of a new sample in the mean
ewma_beta = 0.25            # weight of a new sample in the absolute deviation
k_dev = 4.0                 # estimate = mean + k_dev * deviation
seed_iters = 20             # closed-loop runs per model to seed the estimates (discarded)
# Not from the RFC; set after a 200-frame smoke test showed starvation (see
# bsched/scheduler.py), before any evaluation run. ~1 s at 30 FPS.
probe_after_frames = 30     # a rung idle this long runs once if its EWMA mean fits

[stage4]
detector = "detector_fused"
ladder = ["seg_fused_384x672", "seg_fused_288x512"]   # best quality first; then skip
fps = [0, 10, 15, 20, 25, 30, 35, 40, 45, 50]          # same as Stage 3
repeats = 3
out_dir = "results/stage4"

[tensorrt]
# ORT TensorRT EP (needs TensorRT 10: tensorrt-cu12-libs). Fixed before any
# Stage 5 run. Engines are built once and cached; every timed run loads the
# cached engine in a fresh process.
engine_cache_dir = "models/trt_cache"
max_workspace_mib = 1024
builder_optimization_level = 3   # TensorRT default
# ORT's own graph optimizations are off for TensorRT sessions: at "basic" and
# above ORT re-quantizes conv biases to int32 DequantizeLinear, which TensorRT
# rejects (82 nodes fell to CPU on the INT8 detector). TensorRT does its own
# fusion. Measured: "disable" -> the whole graph runs as one TensorRT engine.
graph_optimization = "disable"

[stage5]
# Precision variants of the three deployed models. Each variant becomes a
# config key "<model>@<variant>" (see bsched/config.py:expand_variants).
models = ["detector_fused", "seg_fused_384x672", "seg_fused_288x512"]
#   cuda_fp32  CUDA EP, FP32 (TF32 convs), the Stage 2-4 reference
#   trt_fp32   TensorRT EP, FP32 graph, FP32/TF32 kernels only
#   trt_fp16   TensorRT EP, FP32 graph, FP16 kernels allowed
#   trt_int8   TensorRT EP, QDQ INT8 graph (explicit quantization), FP16
#              allowed for layers left unquantized
variants = ["cuda_fp32", "trt_fp32", "trt_fp16", "trt_int8"]
fps = [0, 30]
repeats = 3
out_dir = "results/stage5"
# INT8 post-training quantization (scripts/quantize_int8.py). Calibration
# frames come from the TRAIN splits only; evaluation uses val.
calib_images = 256
calib_method = "MinMax"
quant_op_types = ["Conv", "MatMul", "Gemm"]   # norms, softmax, heads' glue stay float
per_channel = true
# Detection mAP (scripts/eval_det.py), BDD100K 100k val, COCO-style AP.
det_frames_glob = "data/bdd100k/images/100k/val/*.jpg"
det_labels_dir = "data/bdd100k/labels/det_v1/val"
det_score_threshold = 0.001      # keep all of YOLOv10's top-300 for AP
det_max_dets = 100               # per image, as COCO
# BDD100K category -> COCO class used by the COCO-trained YOLOv10n. BDD
# "rider" is a person in COCO. BDD "traffic sign" has no COCO class and is
# not evaluated.
det_class_map = { person = "person", rider = "person", car = "car", truck = "truck", bus = "bus", train = "train", motor = "motorcycle", bike = "bicycle", "traffic light" = "traffic light" }

[stage1]
n_frames = 20
n_visualize = 4
out_dir = "results/stage1"
